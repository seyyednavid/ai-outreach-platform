server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # A single-page app: /drafts, /owner, ... are React routes, so any
    # path without a real file gets index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security headers. A location with its own add_header does NOT inherit
    # these, so the two locations below repeat them.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Built files have a content hash in their name: cache them for a year.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # index.html must always be fresh, so new releases load at once.
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
