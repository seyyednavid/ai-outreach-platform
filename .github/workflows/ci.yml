# Runs on every push to main and every pull request.
# Three checks: backend (lint + tests), frontend (lint + build), and
# the two Docker images. No real keys are used: tests never call OpenAI.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push cancels the previous run on the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # A throwaway PostgreSQL, the same version as compose.yaml.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: outreach
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: outreach_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U outreach -d outreach_test_db"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    # Placeholders: the settings need a value, the tests never use them.
    env:
      DATABASE_URL: postgresql+psycopg://outreach:ci_password@127.0.0.1:5432/outreach_test_db
      TEST_DATABASE_URL: postgresql+psycopg://outreach:ci_password@127.0.0.1:5432/outreach_test_db
      OPENAI_API_KEY: sk-ci-not-a-real-key
      GOOGLE_CLIENT_ID: ci
      GOOGLE_CLIENT_SECRET: ci
      GOOGLE_REDIRECT_URI: http://127.0.0.1:8000/api/v1/gmail/callback

    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.30"
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies (exact versions from uv.lock)
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Migrations apply to an empty database
        run: uv run alembic upgrade head

      - name: Tests
        run: uv run pytest -q

  frontend:
    name: Frontend (eslint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      # Public placeholders so the build has values to embed.
      VITE_API_BASE_URL: http://127.0.0.1:8000/api/v1
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies (exact versions from package-lock.json)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check and build
        run: npm run build

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    # Only build images for code that passed the checks above.
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v5

      - name: Backend image
        run: docker build --tag ai-outreach-backend:ci ./backend

      - name: Frontend image
        run: docker build --tag ai-outreach-frontend:ci ./frontend
