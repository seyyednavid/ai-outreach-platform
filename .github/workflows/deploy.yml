# Continuous deployment to Cloud Run.
#
# Runs after the CI workflow finishes successfully for a push to main.
# Builds both images from that exact commit, pushes them to Artifact
# Registry and rolls out new revisions. Only the image changes: settings,
# secrets, scaling and IAM stay as Terraform set them.
#
# Off until the repository variable CD_ENABLED is "true".
#
# Logs in to Google Cloud with Workload Identity Federation: no JSON key.
# Values come from the GitHub environment "production" (not secrets):
#   GCP_WORKLOAD_IDENTITY_PROVIDER, GCP_DEPLOY_SERVICE_ACCOUNT  (terraform output)
#   VITE_SUPABASE_URL, VITE_SUPABASE_PUBLISHABLE_KEY            (public, built into the browser code)
#
# Database migrations are NEVER run here. The migration job is pointed at
# the new image, and a person runs it:
#   gcloud run jobs execute ai-outreach-migrate --region europe-west2 --wait
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

# Nothing by default; the job asks for what it needs.
permissions: {}

# One deployment at a time. A newer commit waits instead of cancelling a
# rollout halfway.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  PROJECT_ID: ai-outreach-platform-demo
  REGION: europe-west2
  REGISTRY: europe-west2-docker.pkg.dev/ai-outreach-platform-demo/ai-outreach
  BACKEND_URL: https://ai-outreach-backend-759154400090.europe-west2.run.app
  FRONTEND_URL: https://ai-outreach-frontend-759154400090.europe-west2.run.app

jobs:
  deploy:
    name: Build, push and deploy
    # Only for green CI on a push to main of this repository (never for
    # pull requests, including from forks).
    if: >-
      vars.CD_ENABLED == 'true' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: ${{ env.FRONTEND_URL }}
    permissions:
      contents: read
      id-token: write # lets the job ask GitHub for its OIDC token (Workload Identity Federation)

    env:
      # The commit CI tested, not whatever main is now.
      COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
      VITE_API_BASE_URL: https://ai-outreach-backend-759154400090.europe-west2.run.app/api/v1
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}

    steps:
      - name: Check the production settings exist
        env:
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
        run: |
          missing=0
          for name in GCP_WORKLOAD_IDENTITY_PROVIDER GCP_DEPLOY_SERVICE_ACCOUNT VITE_SUPABASE_URL VITE_SUPABASE_PUBLISHABLE_KEY; do
            if [ -z "${!name}" ]; then echo "::error::Variable $name is not set in the production environment"; missing=1; fi
          done
          case "$VITE_SUPABASE_PUBLISHABLE_KEY" in
            sb_publishable_*) ;;
            *) echo "::error::VITE_SUPABASE_PUBLISHABLE_KEY must be the publishable key (sb_publishable_...), never a secret key"; missing=1 ;;
          esac
          exit $missing

      - uses: actions/checkout@v5
        with:
          ref: ${{ env.COMMIT_SHA }}
          persist-credentials: false

      - name: Image names (tag = first 12 characters of the commit)
        run: |
          tag="${COMMIT_SHA:0:12}"
          echo "BACKEND_IMAGE=$REGISTRY/backend:$tag" >> "$GITHUB_ENV"
          echo "FRONTEND_IMAGE=$REGISTRY/frontend:$tag" >> "$GITHUB_ENV"

      # Images are built before logging in to Google Cloud, so the build
      # steps never have access to cloud credentials.
      - name: Build backend image
        run: docker build --tag "$BACKEND_IMAGE" ./backend

      - name: Build frontend image (production VITE_ values)
        run: |
          docker build \
            --build-arg VITE_API_BASE_URL \
            --build-arg VITE_SUPABASE_URL \
            --build-arg VITE_SUPABASE_PUBLISHABLE_KEY \
            --tag "$FRONTEND_IMAGE" ./frontend

      - name: Check the frontend calls the production API
        run: |
          docker run --rm -e API="$VITE_API_BASE_URL" --entrypoint sh "$FRONTEND_IMAGE" \
            -c 'grep -qF "$API" /usr/share/nginx/html/assets/*.js'

      - name: Log in to Google Cloud (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Push images
        run: |
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          docker push "$BACKEND_IMAGE"
          docker push "$FRONTEND_IMAGE"

      # "update" changes only the image. Environment variables, secrets,
      # scaling, service account and IAM stay as they are.
      - name: Point the migration job at the new image (does not run it)
        run: |
          gcloud run jobs update ai-outreach-migrate \
            --image "$BACKEND_IMAGE" --region "$REGION" --project "$PROJECT_ID" --quiet

      # If the new revision fails its startup check, this step fails and
      # the previous revision keeps serving traffic.
      - name: Deploy backend
        run: |
          gcloud run services update ai-outreach-backend \
            --image "$BACKEND_IMAGE" --region "$REGION" --project "$PROJECT_ID" --quiet

      - name: Check backend (database reachable)
        run: curl --fail --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors "$BACKEND_URL/api/v1/health/ready"

      - name: Deploy frontend
        run: |
          gcloud run services update ai-outreach-frontend \
            --image "$FRONTEND_IMAGE" --region "$REGION" --project "$PROJECT_ID" --quiet

      - name: Check frontend
        run: curl --fail --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors --output /dev/null "$FRONTEND_URL/"

      - name: Summary
        run: |
          {
            echo "### Deployed ${COMMIT_SHA:0:12}"
            echo "- Backend: \`$BACKEND_IMAGE\`"
            echo "- Frontend: \`$FRONTEND_IMAGE\`"
            echo "- Migration job updated, **not run**. If this commit adds a migration:"
            echo "  \`gcloud run jobs execute ai-outreach-migrate --region $REGION --wait\`"
          } >> "$GITHUB_STEP_SUMMARY"
