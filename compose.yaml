
services:
  db:
    image: postgres:17
    container_name: ai-outreach-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: outreach
      POSTGRES_PASSWORD: local_dev_password
      POSTGRES_DB: outreach_db
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U outreach -d outreach_db"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
