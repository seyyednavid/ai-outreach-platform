# Address order for the backend container (glibc getaddrinfo).
# Prefer IPv6, then IPv4. Docker gives the container a private IPv6
# address (fc00::/7); without the "label fc00::/7 1" line Linux would
# still try IPv4 first. On some networks IPv4 connections to Google
# time out, so the Gmail sign-in failed.
# Harmless where there is no IPv6: those attempts fail at once.
label ::1/128 0
label ::/0 1
label fc00::/7 1
label ::ffff:0:0/96 4
precedence ::1/128 50
precedence ::/0 40
precedence ::ffff:0:0/96 10
